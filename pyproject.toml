[project]
name = "packet-review-os"
version = "1.1.0"
description = "Scorecard-grounded candidate packet review for a non-developer hiring manager."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["packet_review_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:packet_review_os.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
# str+Enum is deliberate: it keeps JSON round-trips stable for stored reviews.
"packet_review_os/schemas.py" = ["UP042"]
# Depends() / Form() / File() in defaults is the FastAPI idiom.
"packet_review_os/web.py" = ["B008"]
# SIM117: nesting stub_transport inside pytest.raises reads better than merging them.
"tests/*" = ["S", "B011", "SIM117"]
"evaluation/*" = ["S"]
"scripts/*" = ["S"]
